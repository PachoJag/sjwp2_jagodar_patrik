    <!-- house -->
    <script>
      let c = document.getElementById("myCanvas");
      let ctx = c.getContext("2d");

      ctx.beginPath();
      ctx.rect(50, 250, 300, 200);
      ctx.fillStyle = "blue";
      ctx.fill();

      ctx.beginPath();
      ctx.rect(75, 350, 50, 100);
      ctx.fillStyle = "lightblue";
      ctx.fill();

      ctx.beginPath();
      ctx.rect(200, 350, 75, 50);
      ctx.fillStyle = "lightblue";
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(50, 250);
      ctx.lineTo(200, 150);
      ctx.lineTo(350, 250);
      ctx.lineTo(50, 250);
      ctx.fillStyle = "red";
      ctx.fill();

      ctx.beginPath();
      ctx.rect(425, 250, 25, 200);
      ctx.fillStyle = "brown";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(438, 250, 50, 0, 2 * Math.PI);
      ctx.fillStyle = "green";
      ctx.fill();
    </script>
  </body>
