<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p id="no" style="font-size: 20px">0</p>
    <button id="btn">Click</button>

    <script>
      const broj = document.getElementById("broj");
      const gumb = document.getElementById("gumb");
      let brojac = 0;
      gumb.onclick = function () {
        brojac = brojac + 1;
        broj.textContent = brojac;

        if (brojac >= 10) {
          broj.style.color = "green";
        }
      };
    </script>
  </body>
</html>
