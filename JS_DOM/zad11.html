<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <a id="poveznica" href="https://www.wikipedia.org">Wikipedia</a>
    <br /><br />
    <button id="gumb">Promijeni poveznicu</button>
    <script>
      const link = document.getElementById("poveznica");
      const btn = document.getElementById("gumb");

      btn.onclick = function () {
        link.setAttribute("href", "https://www.w3schools.com");
        link.textContent("W3Schools");
      };
    </script>
  </body>
</html>
