<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18.09.2026. HTML SVG - zadatci</title>
    <style>
                  .gingerbread {
                    fill: #cf8436;
                  }

                  .eye,
                  .button {
                    fill: #000;
                  }

                  .mouth {
                    fill: none;
                    stroke: white;
                    stroke-width: 4;
                    stroke-linecap: round;
                  }
                </style>
</head>
<body>
    <h1>SVG oblici</h1>

    <svg width="600" height="450" style="border: 1px solid black">
      <!-- 1. Pravokutnik -->
      <rect
        x="30"
        y="30"
        width="150"
        height="80"
        fill="lightblue"
        stroke="black"
        stroke-width="3"
      />

      <!-- 2. Zaobljeni pravokutnik -->
      <rect
        x="210"
        y="30"
        width="150"
        height="80"
        rx="15"
        fill="orange"
        stroke="black"
        stroke-width="3"
      />

      <!-- 3. Krug -->
      <circle
        cx="450"
        cy="70"
        r="40"
        fill="yellow"
        stroke="black"
        stroke-width="3"
      />

      <!-- 4. Elipsa -->
      <ellipse
        cx="120"
        cy="190"
        rx="80"
        ry="40"
        fill="pink"
        stroke="black"
        stroke-width="3"
      />

      <!-- 5. Linija -->
      <line x1="250" y1="150" x2="500" y2="220" stroke="red" stroke-width="5" />

      <!-- 6. Trokut -->
      <polygon
        points="150,280 70,390 230,390"
        fill="lightgreen"
        stroke="black"
        stroke-width="3"
      />

      <!-- 7. Kvadrat / mnogokut -->
      <polygon
        points="300,280 400,280 400,380 300,380"
        fill="lightblue"
        stroke="black"
        stroke-width="3"
      />

      <!-- 8. Polukrug -->
      <path
        d="M 450 380 A 50 50 0 0 1 550 380"
        fill="yellow"
        stroke="black"
        stroke-width="3"
      />
    </svg>

    <svg width="600" height="600" style="border: 5px solid black" >

       <polygon points="200,250 280,390 200,390" fill="white"/>
       <polygon points="170,210 120,185 170,160" fill="green"/>
    </svg>
