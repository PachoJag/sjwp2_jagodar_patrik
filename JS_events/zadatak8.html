<!DOCTYPE html><html lang="hr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zadatak 8 – Reakcijski test</title><style>body{font-family:sans-serif;max-width:640px;margin:30px auto;padding:0 16px}button{padding:6px 14px;margin:3px;cursor:pointer}input,select{padding:6px;margin:3px}.err{color:#c0392b}.ok{color:#27ae60}li{margin:4px 0}</style></head><body><h1>Reakcijski test</h1>
<div id="povrsina" style="height:200px;background:#888;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;user-select:none">Klikni „Pokreni”</div>
<button id="pokreni">Pokreni</button><button id="otkazi">Otkaži</button><button id="ponovi">Ponovi</button>
<script>
const pov=document.getElementById("povrsina"), pokreni=document.getElementById("pokreni");
let timerId=null, pocetak=0, stanje="mirovanje"; // mirovanje | cekanje | spremno
function postavi(tekst,boja){pov.textContent=tekst;pov.style.background=boja;}
function pokreniTest(){
  if(stanje!=="mirovanje") return; // sprječava višestruko pokretanje
  stanje="cekanje"; pokreni.disabled=true;
  postavi("Čekaj zelenu boju...","#c0392b");
  const odgoda=1000+Math.random()*4000;
  timerId=setTimeout(()=>{
    stanje="spremno"; pocetak=performance.now(); postavi("KLIK!","#27ae60");
  },odgoda);
}
function klikPovrsina(){
  if(stanje==="cekanje"){
    clearTimeout(timerId); stanje="mirovanje"; pokreni.disabled=false;
    postavi("Prerano! Pokušaj ponovo.","#e67e22");
  } else if(stanje==="spremno"){
    const t=Math.round(performance.now()-pocetak);
    stanje="mirovanje"; pokreni.disabled=false;
    postavi(`Vrijeme reakcije: ${t} ms`,"#2980b9");
  }
}
function otkazi(){
  if(stanje==="cekanje"){ clearTimeout(timerId); stanje="mirovanje"; pokreni.disabled=false; postavi("Otkazano.","#888"); }
}
function ponovi(){
  clearTimeout(timerId); stanje="mirovanje"; pokreni.disabled=false; pokreniTest();
}
pokreni.addEventListener("click",pokreniTest);
pov.addEventListener("click",klikPovrsina);
document.getElementById("otkazi").addEventListener("click",otkazi);
document.getElementById("ponovi").addEventListener("click",ponovi);
</script>
</body></html>
