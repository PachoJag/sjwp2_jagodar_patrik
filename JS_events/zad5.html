<!DOCTYPE html><html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Zad 5</title>
	<style>
    body
    {
		font-family:sans-serif;
        max-width:640px;
        margin:30px auto;
        padding:0 16px
    }
    button
    {
        padding:6px 14px;
        margin:3px;
        cursor:pointer
    }
    input,select
    {
        padding:6px;
        margin:3px
    }
    .err{color:#c0392b}
    .ok{color:#27ae60}
    li{margin:4px 0}
    </style>
</head>
<body>
    <h1>Semafor</h1>
    <div id="svjetla" style="width:70px;background:#222;padding:10px;border-radius:10px">
        <div class="s" data-b="crvena" style="height:50px;width:50px;border-radius:50%;margin:5px;background:#555"></div>
        <div class="s" data-b="žuta" style="height:50px;width:50px;border-radius:50%;margin:5px;background:#555"></div>
        <div class="s" data-b="zelena" style="height:50px;width:50px;border-radius:50%;margin:5px;background:#555"></div>
    </div>
    <p id="stanje"></p>
    <p id="greska" class="err"></p>
    <button id="ukljuci">Uključi</button>
    <button id="iskljuci">Isključi</button>
    <button data-boja="crvena">Crvena</button>
    <button data-boja="žuta">Žuta</button>
    <button data-boja="zelena">Zelena</button>
    <script>
        const semafor={
            boja:"crvena", trajanje:5, ukljucen:false,
            promijeniBoju(novaBoja){
                if(!this.ukljucen){ return false; }
                this.boja=novaBoja; return true;
            },
            ukljuci(){ this.ukljucen=true; },
            iskljuci(){ this.ukljucen=false; },
            prikaziStanje(){
                return `Boja: ${this.boja}, trajanje: ${this.trajanje} s, ${this.ukljucen?"uključen":"isključen"}`;
            }
        };
        const boje={crvena:"red",žuta:"gold",zelena:"limegreen"};
        function osvjezi(){
            document.querySelectorAll(".s").forEach(s=>{
                s.style.background = (semafor.ukljucen && s.dataset.b===semafor.boja) ? boje[s.dataset.b] : "#555";
            });
            document.getElementById("stanje").textContent=semafor.prikaziStanje();
        }
        document.getElementById("ukljuci").addEventListener("click",()=>{semafor.ukljuci();document.getElementById("greska").textContent="";osvjezi();});
        document.getElementById("iskljuci").addEventListener("click",()=>{semafor.iskljuci();osvjezi();});
        document.querySelectorAll("[data-boja]").forEach(g=>g.addEventListener("click",()=>{
            const ok=semafor.promijeniBoju(g.dataset.boja);
            document.getElementById("greska").textContent= ok ? "" : "Semafor je isključen – ne može se mijenjati boja.";
            osvjezi();
        }));
        osvjezi();
    </script>
</body>
</html>
